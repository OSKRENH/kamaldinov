name: Capture Popolam browser and iPhone mockups

on:
  push:
    paths:
      - .github/workflows/capture-popolam-mockups.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and image tools
        run: python -m pip install --quiet playwright pillow
      - name: Screenshot real Popolam desktop and mobile homepage
        run: |
          mkdir -p images/pets
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root = Path('images/pets')
          with sync_playwright() as playwright:
              try:
                  browser = playwright.chromium.launch(channel='chrome', headless=True, args=['--no-sandbox'])
              except Exception as error:
                  print('Chrome unavailable, downloading Chromium:', error)
                  import subprocess, sys
                  subprocess.run([sys.executable, '-m', 'playwright', 'install', 'chromium'], check=True)
                  browser = playwright.chromium.launch(headless=True, args=['--no-sandbox'])
              for label, width, height, mobile in [
                ('desktop', 1536, 900, False),
                ('mobile', 390, 844, True),
              ]:
                  context = browser.new_context(
                      viewport={'width': width, 'height': height},
                      device_scale_factor=2,
                      is_mobile=mobile,
                      has_touch=mobile,
                      locale='ru-RU',
                      color_scheme='light'
                  )
                  page = context.new_page()
                  response = page.goto('https://popolam.online/', wait_until='domcontentloaded', timeout=60000)
                  print(label, 'HTTP', response.status if response else None, 'title', page.title())
                  page.wait_for_selector('#home-title', state='visible', timeout=30000)
                  page.wait_for_selector('#pack-grid .pack-card', state='visible', timeout=30000)
                  page.add_style_tag(content='*,*::before,*::after {animation:none!important;transition:none!important}')
                  page.wait_for_timeout(700)
                  path = root / f'popolam-{label}-screen.png'
                  page.screenshot(path=str(path), animations='disabled')
                  print('Saved', path, path.stat().st_size, 'bytes')
                  context.close()
              browser.close()
          PY
      - name: Design matching Safari and iPhone compositions
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps
          from pathlib import Path
          root = Path('images/pets')
          desk = Image.open(root/'popolam-desktop-screen.png').convert('RGB')
          phone = Image.open(root/'popolam-mobile-screen.png').convert('RGB')
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 17)
              small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 16)
          except OSError:
              font = ImageFont.load_default()
              small = font

          def rounded_crop(pic, size, radius):
              pic = ImageOps.fit(pic,size,method=Image.Resampling.LANCZOS,centering=(.5,0))
              mask = Image.new('L', size, 0)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,size[0]-1,size[1]-1), radius, fill=255)
              a = pic.convert('RGBA'); a.putalpha(mask)
              return a

          def shadow(out, bounds, radius, blur=30, opacity=45, offset=20):
              x,y,w,h=bounds
              layer=Image.new('RGBA',out.size,(0,0,0,0))
              ImageDraw.Draw(layer).rounded_rectangle((x,y+offset,x+w,y+h+offset),radius,fill=(18,23,25,opacity))
              out.alpha_composite(layer.filter(ImageFilter.GaussianBlur(blur)))

          def browser(out, x, y, width, height):
              tool=65; radius=23
              shadow(out,(x,y,width,height),radius,32,52,20)
              box=Image.new('RGBA',(width,height),(0,0,0,0))
              d=ImageDraw.Draw(box)
              d.rounded_rectangle((0,0,width-1,height-1),radius,fill=(246,246,244,255),outline=(201,202,200,255),width=2)
              d.rectangle((0,tool-2,width-1,tool+1),fill=(225,225,223,255))
              for i,color in enumerate([(255,95,86,255),(255,189,46,255),(39,201,63,255)]):
                  d.ellipse((24+i*26,24,37+i*26,37),fill=color)
              addr_width=min(int(width*.39),530)
              addr_x=(width-addr_width)//2
              d.rounded_rectangle((addr_x,12,addr_x+addr_width,51),13,fill=(232,231,228,255))
              d.text((addr_x+addr_width//2,32),'popolam.online',fill=(54,54,53,255),font=font,anchor='mm')
              d.text((width-50,32),'↗',fill=(70,70,70,255),font=font,anchor='mm')
              shot=ImageOps.fit(desk,(width-3,height-tool-3),Image.Resampling.LANCZOS,centering=(.5,0))
              box.alpha_composite(shot.convert('RGBA'),(2,tool+1))
              out.alpha_composite(box,(x,y))

          def iphone(out,x,y,width,height):
              radius=int(width*.12);rim=11
              shadow(out,(x,y,width,height),radius,38,70,22)
              layer=Image.new('RGBA',(width,height),(0,0,0,0))
              d=ImageDraw.Draw(layer)
              d.rounded_rectangle((0,0,width-1,height-1),radius,fill=(16,17,19,255),outline=(64,65,68,255),width=3)
              # Slight inset frame, real mobile homepage visible underneath.
              inner=(rim,rim,width-rim*2,height-rim*2)
              img=rounded_crop(phone,(inner[2],inner[3]),radius-rim//2)
              layer.alpha_composite(img,(rim,rim))
              island_w=int(width*.27); island_h=23
              d.rounded_rectangle(((width-island_w)//2,rim+7,(width+island_w)//2,rim+7+island_h),island_h//2,fill=(18,18,20,255))
              d.rounded_rectangle((0,0,width-1,height-1),radius,outline=(42,43,45,255),width=4)
              out.alpha_composite(layer,(x,y))

          def background(w,h):
              img=Image.new('RGBA',(w,h),(237,237,232,255))
              d=ImageDraw.Draw(img)
              for i in range(h):
                  f=i/max(h-1,1)
                  c=int(243-13*f)
                  d.line((0,i,w,i),fill=(c,c,c-2,255))
              return img

          landscape=background(2300,1260)
          browser(landscape,72,115,1660,1000)
          iphone(landscape,1762,139,389,870)
          landscape.convert('RGB').save(root/'popolam-safari-iphone.webp','WEBP',quality=93,method=6)

          portrait=background(1100,1400)
          browser(portrait,48,100,1004,870)
          iphone(portrait,635,520,390,839)
          portrait.convert('RGB').save(root/'popolam-safari-iphone-mobile.webp','WEBP',quality=93,method=6)

          for path in [root/'popolam-safari-iphone.webp',root/'popolam-safari-iphone-mobile.webp']:
              print('Output:',path,Image.open(path).size,path.stat().st_size)
          PY
      - name: Commit composed browser and phone mockups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pets/popolam-safari-iphone.webp images/pets/popolam-safari-iphone-mobile.webp
          git commit -m "Capture real Popolam homepage in Safari and phone portfolio mockups"
          git push
