name: Prepare clean AI infographic cover

on:
  push:
    paths:
      - .github/workflows/prepare-ai-cover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Remove white edge artifact and trim right border
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('images/drive/ai-and-big-data.webp')
          target = Path('images/drive/ai-and-big-data-clean.webp')
          image = Image.open(source).convert('RGB')
          width, height = image.size
          px = image.load()
          samples = [round(height*ratio) for ratio in (.158,.17,.18,.19,.20,.205,.215)]
          for y in samples:
              print(f'Row {y}: '+str([(x,px[x,y]) for x in (620,680,730,770,810,830)]))
          changed = 0
          changed_rows = set()
          # Light triangular strip is embedded in the original artwork at
          # upper-right, beneath the purple header; preserve the white logo
          # positioned much higher in the image.
          def near_white(color):
              return min(color) >= 165 and max(color)-min(color) <= 95
          for y in range(round(height*.135), round(height*.228)):
              bg = px[round(width*.75),y]
              if near_white(bg):
                  bg = px[round(width*.69),y]
              for x in range(round(width*.77),width):
                  if near_white(px[x,y]):
                      px[x,y] = bg
                      changed += 1
                      changed_rows.add(y)
          image = image.crop((0,0,width-7,height))
          image.save(target, 'WEBP', quality=94, method=6)
          print(f'Original: {width}x{height}; clean: {image.width}x{image.height}')
          print(f'Replaced bright edge pixels: {changed} in {len(changed_rows)} rows')
          print(f'New cover: {target}, {target.stat().st_size} bytes')
          PY
      - name: Commit clean cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/drive/ai-and-big-data-clean.webp
          git commit -m "Add corrected AI infographic cover without right white edge"
          git push
