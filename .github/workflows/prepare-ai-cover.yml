name: Prepare clean AI infographic cover

on:
  push:
    paths:
      - .github/workflows/prepare-ai-cover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Remove white edge artifact and trim right border
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('images/drive/ai-and-big-data.webp')
          target = Path('images/drive/ai-and-big-data-clean.webp')
          image = Image.open(source).convert('RGB')
          width, height = image.size
          px = image.load()
          changed_rows = 0
          leftmost = width
          # The bright triangular artifact is confined to the right edge
          # of the header, below the legitimate Singularity University logo.
          # Keep the full logo and its spacing; repair only those edge rows.
          for y in range(round(height * .142), round(height * .225)):
              r,g,b = px[width-2,y]
              if min(r,g,b) < 228 or max(r,g,b)-min(r,g,b) > 23:
                  continue
              x = width - 1
              while x >= round(width * .69):
                  r,g,b = px[x,y]
                  if min(r,g,b) < 215 or max(r,g,b)-min(r,g,b) > 32:
                      break
                  x -= 1
              if width - x < 10:
                  continue
              start = x + 1
              # Sample the opaque background immediately to the left of
              # the light strip; do not touch the rest of the artwork.
              fill = px[max(0, x-3),y]
              for xx in range(start,width):
                  px[xx,y] = fill
              changed_rows += 1
              leftmost = min(leftmost,start)
          # Trim a few white/fringing pixels along the outer right edge.
          image = image.crop((0,0,width-4,height))
          image.save(target, 'WEBP', quality=93, method=6)
          print(f'Original dimensions: {width}x{height}')
          print(f'Clean dimensions: {image.width}x{image.height}')
          print(f'White edge rows repaired: {changed_rows}, earliest x: {leftmost}')
          print(f'New cover: {target}, {target.stat().st_size} bytes')
          PY
      - name: Commit clean cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/drive/ai-and-big-data-clean.webp
          git commit -m "Add corrected AI infographic cover without right white edge"
          git push
