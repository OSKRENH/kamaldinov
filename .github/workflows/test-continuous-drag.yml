name: Test continuous gallery drag and arrow font

on:
  push:
    paths:
      - .github/workflows/test-continuous-drag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools
        run: python -m pip install --quiet playwright fonttools
      - name: Check font glyph, desktop drag handoff and mobile partial swipe
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont('fonts/LTSuperior-Regular.otf')
          chars = set()
          for table in font['cmap'].tables:
              if table.isUnicode(): chars.update(table.cmap)
          for mark,cp in [('LEFT ARROW',0x2190),('RIGHT ARROW',0x2192)]:
              print('FONT:',mark,'in LT Superior:',cp in chars)
          PY
          python - <<'PY'
          import subprocess, sys, time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen([sys.executable,'-m','http.server','8177','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
                  def check(mobile):
                      cfg=dict(viewport={'width':390,'height':844} if mobile else {'width':1440,'height':900},locale='ru-RU',reduced_motion='no-preference')
                      if mobile: cfg.update(is_mobile=True,has_touch=True,device_scale_factor=2)
                      ctx=browser.new_context(**cfg);page=ctx.new_page()
                      errors=[];page.on('pageerror',lambda error: errors.append(str(error)))
                      page.goto('http://127.0.0.1:8177/',wait_until='domcontentloaded')
                      page.wait_for_function('!document.querySelector("#portfolio").hasAttribute("data-opening")',timeout=45000)
                      page.locator('.slide.is-current').wait_for(state='attached')
                      layer=page.locator('#gallery-hitarea');box=layer.bounding_box();assert box
                      initial=int(page.locator('.counter-window .counter-number').inner_text())
                      total=int(page.locator('.counter-total').inner_text())
                      assert total >=2
                      next_index=initial%total+1
                      print(('MOBILE' if mobile else 'DESKTOP'),'initial:',initial,'total:',total)
                      if not mobile:
                          page.mouse.move(box['x']+box['width']*.8,box['y']+box['height']*.40)
                          cursor=page.locator('#gallery-cursor')
                          style=cursor.evaluate('el => ({font:getComputedStyle(el).fontFamily,size:parseFloat(getComputedStyle(el).fontSize)})')
                          print('CURSOR:',style)
                          assert 'LT Superior' in style['font'] and style['size'] < 27
                          x=box['x']+box['width']*.82;y=box['y']+box['height']*.45;distance=box['width']*.35
                          page.mouse.move(x,y);page.mouse.down()
                          for i in range(1,6):
                              page.mouse.move(x-distance*i/5,y,steps=2)
                          drag_val=page.locator('.slide.is-current').evaluate('el=>getComputedStyle(el).transform')
                          assert 'matrix' in drag_val, drag_val
                          page.mouse.up()
                      else:
                          sx=box['x']+box['width']*.80;ex=sx-box['width']*.35;sy=box['y']+box['height']*.4
                          cdp=ctx.new_cdp_session(page)
                          cdp.send('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':sx,'y':sy,'id':1}]})
                          for j in range(1,7):
                              cdp.send('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':sx+(ex-sx)*j/6,'y':sy,'id':1}]})
                              page.wait_for_timeout(17)
                          drag_val=page.locator('.slide.is-current').evaluate('el=>getComputedStyle(el).transform')
                          assert 'matrix' in drag_val, drag_val
                          cdp.send('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
                      # The outgoing slide must be animated from the drag offset,
                      # NOT made to reappear or revealed anew by clip-path.
                      page.wait_for_function('!!document.querySelector(".slide.is-swipe-outgoing")',timeout=1200)
                      state=page.evaluate('''() => {
                        const old=document.querySelector('.slide.is-swipe-outgoing');
                        const now=document.querySelector('.slide.is-current');
                        return { old: getComputedStyle(old).transform, inline:old.style.transform,
                          animations:old.getAnimations().map(a=>a.effect?.getKeyframes().map(k=>({transform:k.transform,clipPath:k.clipPath}))),
                          newAnimations:now.getAnimations().map(a=>a.effect?.getKeyframes().map(k=>({transform:k.transform,clipPath:k.clipPath}))) }
                      }''')
                      print(('MOBILE' if mobile else 'DESKTOP'),'HANDOFF:',str(state)[:800])
                      assert state['animations'] and 'translate3d' in str(state['animations']),state
                      assert not any('clipPath' in str(key) and key['clipPath'] for seq in state['newAnimations'] for key in seq),state
                      page.wait_for_function('n=>Number(document.querySelector(".counter-number").textContent)===n',arg=next_index,timeout=7000)
                      page.wait_for_function('!document.querySelector(".slide.is-swipe-outgoing")',timeout=7000)
                      assert page.locator('.slide.is-current').count()==1
                      assert not errors,errors
                      print('PASS:', 'mobile mid-swipe continuation' if mobile else 'desktop mid-drag continuation')
                      ctx.close()
                  check(False)
                  check(True)
                  browser.close()
          finally:
              server.terminate()
              try:server.wait(timeout=5)
              except subprocess.TimeoutExpired:server.kill()
          PY
