name: Verify gallery pointer and touch navigation

on:
  push:
    paths:
      - .github/workflows/verify-gallery-gestures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright
      - name: Check desktop clicks, drag and client link; phone taps and swipe
        run: |
          python - <<'PY'
          import subprocess, sys, time
          from playwright.sync_api import sync_playwright
          server = subprocess.Popen([sys.executable, '-m', 'http.server', '8177', '--bind','127.0.0.1'], stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
                  def visit(mobile=False):
                      opts=dict(viewport={'width':390,'height':844} if mobile else {'width':1440,'height':900},
                          reduced_motion='reduce',locale='ru-RU')
                      if mobile: opts.update(is_mobile=True,has_touch=True,device_scale_factor=2)
                      context=browser.new_context(**opts)
                      page=context.new_page()
                      errors=[]
                      page.on('pageerror',lambda ex: errors.append(str(ex)))
                      page.goto('http://127.0.0.1:8177/',wait_until='domcontentloaded')
                      page.locator('.slide.is-current').wait_for(state='attached',timeout=25000)
                      page.locator('#gallery-hitarea').wait_for(state='visible',timeout=25000)
                      assert not errors, errors
                      return context,page,errors

                  def num(page):
                      return int(page.locator('.counter-window .counter-number').inner_text())

                  context,page,errors=visit(False)
                  layer=page.locator('#gallery-hitarea')
                  box=layer.bounding_box()
                  assert box and box['width']>100
                  total=int(page.locator('.counter-total').inner_text())
                  assert total>=2
                  assert page.locator('.carousel-arrows').count()==0
                  assert page.locator('#slide-title').evaluate('(el) => getComputedStyle(el).textDecorationLine.includes("underline")')
                  assert page.locator('#slide-category').evaluate('(el) => el.tagName === "SPAN"')
                  assert page.locator('.gallery-hitarea').evaluate('(el) => getComputedStyle(el).cursor === "none"')
                  # Click right side -> next; click left side -> back.
                  initial=num(page)
                  def next_of(x): return x % total + 1
                  def prev_of(x): return (x-2+total)%total + 1
                  page.mouse.click(box['x']+box['width']*.82,box['y']+box['height']*.35)
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',next_of(initial))
                  assert not page.evaluate('location.hash')
                  page.mouse.click(box['x']+box['width']*.18,box['y']+box['height']*.35)
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',initial)
                  # Drag the current artwork left toward the next slide.
                  x0=box['x']+box['width']*.8
                  y0=box['y']+box['height']*.45
                  page.mouse.move(x0,y0)
                  page.mouse.down()
                  for n in range(1,8):
                      page.mouse.move(x0-box['width']*.55*n/7,y0,steps=2)
                  page.mouse.up()
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',next_of(initial))
                  # Only the underlined client name routes to the project.
                  client_link=page.locator('#caption-link')
                  assert client_link.is_visible()
                  client_link.click()
                  page.wait_for_function('() => location.hash.includes("/") && document.querySelector("#portfolio").dataset.view === "detail"')
                  assert not errors, errors
                  context.close()
                  print('DESKTOP: right/left zones, arrow cursor, drag and detail link PASS')

                  context,page,errors=visit(True)
                  layer=page.locator('#gallery-hitarea')
                  box=layer.bounding_box()
                  total=int(page.locator('.counter-total').inner_text())
                  initial=num(page)
                  y=box['y']+box['height']*.35
                  page.touchscreen.tap(box['x']+box['width']*.8,y)
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',initial%total+1)
                  page.touchscreen.tap(box['x']+box['width']*.2,y)
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',initial)
                  # Simulate a real Chromium touch swipe from right to left.
                  cdp=context.new_cdp_session(page)
                  sx=box['x']+box['width']*.8; ex=box['x']+box['width']*.2
                  sy=box['y']+box['height']*.45
                  cdp.send('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':sx,'y':sy,'id':1}]})
                  for j in range(1,9):
                      cdp.send('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':sx+(ex-sx)*j/8,'y':sy,'id':1}]})
                      page.wait_for_timeout(18)
                  cdp.send('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
                  page.wait_for_function('n => Number(document.querySelector(".counter-number").textContent) === n',initial%total+1)
                  assert not page.evaluate('location.hash')
                  assert not errors, errors
                  print('MOBILE: left/right taps and horizontal swipe PASS')
                  context.close()
                  browser.close()
          finally:
              server.terminate()
              try: server.wait(timeout=5)
              except subprocess.TimeoutExpired: server.kill()
          PY
