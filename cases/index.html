<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кейсы — Иван Камальдинов</title>
<style>
@font-face{font-family:LT;src:url(../fonts/LTSuperior-Regular.otf)}*{box-sizing:border-box}body{margin:0;font-family:LT,Arial,sans-serif;color:#141414}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left;padding:0}button:hover{text-decoration:underline;text-underline-offset:.17em}#list{padding:3.6vmin 4vw}h1{font-size:clamp(36px,5.4vw,100px);font-weight:400;margin:0 0 6vh}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1em 3vw}#items button{padding:10px 0;border-top:1px solid #c3c2bd;display:flex;align-items:center;gap:12px}#items i{width:24px;height:36px;display:block;flex:none}#stage{position:fixed;inset:0;display:grid;place-items:center;transition:background .55s}#stage[hidden],[hidden]{display:none}svg{width:100%;height:100%;font-family:LT,Arial,sans-serif}svg [role=button]{cursor:pointer}svg [role=button]:hover text,svg [role=button]:focus-visible text{text-decoration:underline}svg [role=button]:focus-visible{outline:2px solid currentColor}text{fill:#161616}.active{animation:arrive .52s cubic-bezier(.2,.7,.3,1) both}.reverse{animation-name:retreat}@keyframes arrive{from{opacity:.1;translate:1.8% 0}}@keyframes retreat{from{opacity:.1;translate:-1.8% 0}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style><main id="list"><h1>Иван Камальдинов</h1><nav id="items" aria-label="Проекты"></nav></main><section id="stage" hidden aria-label="Открытый проект"></section><script src="scenes.js"></script><script>
const NS='http://www.w3.org/2000/svg',media=matchMedia('(max-aspect-ratio: 4/5)');let state,dir=1,start,lastScene,lastProject;
function el(tag,attrs={}){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function go(i,k){location.hash=i+'/'+k}
function action(a){if(a==='home'){if(window.parent!==window){window.parent.postMessage({type:'kamaldinov:close-case'},location.origin)}else{location.hash=''}return}let [i,k]=state,L=cases[i].views.length;dir=a==='prev'||Number.isInteger(a)&&a<k?-1:1;go(i,Number.isInteger(a)?a:(k+(dir>0?1:-1)+L)%L)}
cases.forEach((p,i)=>{let b=document.createElement('button'),color=document.createElement('i');color.style.background=p.views[0].desktop.bg;b.append(color,document.createTextNode(p.full));b.onclick=()=>go(i,0);items.append(b)})
function draw(){const m=/^#(\d+)\/(\d+)$/.exec(location.hash);if(!m||!cases[+m[1]]?.views[+m[2]]){stage.hidden=true;list.hidden=false;if(state)items.children[state[0]].focus();state=null;lastScene=null;return}
state=[+m[1],+m[2]];let [i,k]=state,s=cases[i].views[k][media.matches?'mobile':'desktop'];let focused=document.activeElement?.dataset.id;list.hidden=true;stage.hidden=false;stage.style.background=s.bg;const svg=el('svg',{viewBox:'0 0 '+s.w+' '+s.h,role:'group','aria-label':cases[i].full+' — '+cases[i].views[k].label});for(const n of s.nodes){let g=el('g');g.dataset.id=n.id;if(n.type==='art'){const box=el('svg',{x:n.x,y:n.y,width:n.w,height:n.h,overflow:'hidden'});const art=el('image',{x:n.dx,y:n.dy,width:n.iw,height:n.ih,href:'art/'+n.key+'.svg'});art.addEventListener('error',()=>{const fallback=['../images/drive/spentys-playbook.webp','../images/drive/financial-health-and-wellness.webp','../images/drive/portland.webp','../images/drive/jabali-isr.webp','../images/drive/seervision-manual.webp','../images/drive/recruiting-in-insurance.webp','../images/drive/account-based-sales-development.webp','../images/drive/su-ecosystem.webp','../images/drive/ai-and-big-data-clean.webp','../images/drive/su-membership.webp','../images/drive/ccsa-report.webp','../images/drive/music-theory.webp','../images/brandbooks/flat/01.webp','../images/brandbooks/itm/01.webp','../images/pets/popolam-safari-browser.webp'][i];if(art.getAttribute('href')!==fallback)art.setAttribute('href',fallback)},{once:true});box.append(el('rect',{width:'100%',height:'100%',fill:'white'}),art);g.append(box);const prior=lastProject===i && lastScene?.nodes.find(a=>a.id===n.id&&a.key===n.key);
if(prior && !matchMedia('(prefers-reduced-motion: reduce)').matches){const picture=box.lastChild;for(const [attr,prop] of [['x','dx'],['y','dy'],['width','iw'],['height','ih']]){if(prior[prop]!==n[prop]){const anim=el('animate',{attributeName:attr,from:prior[prop],to:n[prop],dur:'.60s',calcMode:'spline',keyTimes:'0;1',keySplines:'.25 .72 .3 1'});picture.append(anim)}}}else g.classList.add('active');if(dir<0)g.classList.add('reverse')}else if(n.type==='marker'){g.append(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,fill:'#161616'}))}else{const t=el('text',{x:n.x,y:n.y+n.size*.82,'font-size':n.size});t.textContent=n.text;if(n.link==='home')t.setAttribute('text-decoration','underline');g.append(t);if(n.id==='section'||n.id==='loc')g.classList.add('active')}
if(n.link!=null){g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',n.text||cases[i].views[typeof n.link==='number'?n.link:(k+1)%cases[i].views.length].label);g.onclick=()=>action(n.link);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(n.link)}};if(n.type==='text'){const pad=n.size*.3;g.insertBefore(el('rect',{x:n.x-pad,y:n.y-pad,width:Math.max(n.text.length*n.size*.54,n.size)+2*pad,height:n.size*1.7,fill:'transparent'}),g.firstChild)}}svg.append(g)}stage.replaceChildren(svg);lastScene=s;lastProject=i;if(focused)svg.querySelector('[data-id="'+focused+'"]')?.focus()}
window.addEventListener('hashchange',draw);media.addEventListener('change',draw);addEventListener('keydown',e=>{if(!state)return;if(['ArrowLeft','ArrowRight','Escape'].includes(e.key)){e.preventDefault();action(e.key==='Escape'?'home':e.key==='ArrowLeft'?'prev':'next')}});stage.ontouchstart=e=>start=e.touches[0].clientX;stage.ontouchend=e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>60){e.preventDefault();action(d<0?'next':'prev')}};draw()
</script></html>
